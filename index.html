<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网易云短信登录 / 注册 API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      pre {
        padding: 12px;
        border-radius: 8px;
        background: color-mix(in srgb, CanvasText 8%, Canvas);
        overflow: auto;
      }
      label {
        display: block;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas);
        background: Canvas;
        color: CanvasText;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        margin-right: 8px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 0;
        background: #1677ff;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: color-mix(in srgb, CanvasText 18%, Canvas);
        color: CanvasText;
      }
      button.danger {
        background: #13c2c2;
      }
      .hint {
        color: color-mix(in srgb, CanvasText 60%, Canvas);
        font-size: 13px;
      }
      .panel {
        margin-top: 24px;
        padding-top: 8px;
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, Canvas);
      }
      #out {
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>网易云短信登录 / 注册</h1>
    <p class="hint">
      登录：<code>/api/sms/send</code> → <code>/api/sms/verify</code><br />
      注册：<code>/api/sms/register/send</code> →
      <code>/api/sms/register</code>（密码网页随机生成）
    </p>

    <label>手机号</label>
    <input id="phone" placeholder="13800138000" />

    <label>国家码</label>
    <input id="cc" value="86" />

    <label>短信验证码</label>
    <input id="code" placeholder="收到短信后再填" />

    <div class="panel">
      <h3>登录</h3>
      <button id="btnSend">1. 登录发码</button>
      <button id="btnVerify" class="secondary">2. 验证并登录</button>
    </div>

    <div class="panel">
      <h3>注册</h3>
      <p class="hint">
        注册密码由页面随机生成并提交；成功后会在结果里回显
        <code>password</code>。
      </p>
      <button id="btnRegSend" class="danger">1. 注册发码</button>
      <button id="btnRegister" class="secondary">2. 提交注册</button>
    </div>

    <h3>结果</h3>
    <pre id="out">等待操作…</pre>

    <script>
      const $ = (id) => document.getElementById(id);
      let lastCookie = "";

      function randomPassword(len = 10) {
        const chars =
          "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let text = "";
        for (let i = 0; i < len; i++) {
          text += chars[Math.floor(Math.random() * chars.length)];
        }
        return text;
      }

      async function call(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { ok: false, message: text };
        }
        $("out").textContent = JSON.stringify(data, null, 2);
        if (data.cookie) lastCookie = data.cookie;
        return data;
      }

      $("btnSend").onclick = async () => {
        $("out").textContent = "登录发码中…";
        await call("/api/sms/send", {
          phone: $("phone").value.trim(),
          countrycode: $("cc").value.trim() || "86",
        });
      };

      $("btnVerify").onclick = async () => {
        $("out").textContent = "登录中…";
        await call("/api/sms/verify", {
          phone: $("phone").value.trim(),
          code: $("code").value.trim(),
          countrycode: $("cc").value.trim() || "86",
          cookie: lastCookie || undefined,
        });
      };

      $("btnRegSend").onclick = async () => {
        $("out").textContent = "注册发码中…";
        await call("/api/sms/register/send", {
          phone: $("phone").value.trim(),
          countrycode: $("cc").value.trim() || "86",
          cookie: lastCookie || undefined,
        });
      };

      $("btnRegister").onclick = async () => {
        const password = randomPassword(10);
        $("out").textContent = `注册中（随机密码 ${password}）…`;
        await call("/api/sms/register", {
          phone: $("phone").value.trim(),
          code: $("code").value.trim(),
          countrycode: $("cc").value.trim() || "86",
          password,
          cookie: lastCookie || undefined,
        });
      };
    </script>
  </body>
</html>
